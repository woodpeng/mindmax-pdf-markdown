name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/check-size.mjs

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  package:
    name: package (publint + types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The two failures that only show up after publishing: a broken exports
      # map, and types that do not resolve for both module systems.
      - run: pnpm check:pkg
      # Smoke-test the built artifact the way a consumer would load it.
      - run: node -e "const m=require('./dist/index.cjs'); if (typeof m.convertPdfToMarkdown!=='function') process.exit(1)"
      - run: node --input-type=module -e "import('./dist/index.js').then(m=>{if(typeof m.convertPdfToMarkdown!=='function')process.exit(1)})"

  corpus:
    name: corpus (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 22 only: pdfjs-dist 6 uses Promise.withResolvers, which Node 20
        # does not have. The library itself still runs on 18+; this job is dev
        # tooling (it drives pdf.js to produce the text layer).
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # ~82 MB of PDFs, keyed by the manifest: a new document downloads once.
      - uses: actions/cache@v4
        with:
          path: eval/corpus/cache
          key: corpus-${{ hashFiles('eval/corpus/manifest.json') }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm eval --fetch
      - run: pnpm eval
