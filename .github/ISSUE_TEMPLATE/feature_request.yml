name: Feature request
description: A layout, output shape or API that is not handled today.
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The document or workflow, not the implementation you have in mind.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: Current output, or the error.
    validations:
      required: false

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Is this in scope?
      description: |
        Reading a text layer is in scope. Producing a text layer is not: OCR, handwriting and
        vector-only pages need a different kind of tool, and this library will not grow one.
      options:
        - label: This works on the PDF's own text layer (not OCR of a scan).
          required: true
